server.port=8080

# Variables de entorno del .env (Spring las resuelve con ${...})
spring.datasource.url=${DATABASE_URL_CLASES}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Subida de presentaciones
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.uploads=/data/uploads
app.secret=${SECRET_KEY}
app.internal-token=${INTERNAL_TOKEN}
app.ia-url=http://servicio-ia:3000
app.notif-url=http://servicio-notificaciones:8080
app.public-url=${PUBLIC_URL}
server.error.include-message=always

# Nombres de archivo con tildes (ej. "Métodos.pdf") en las subidas
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

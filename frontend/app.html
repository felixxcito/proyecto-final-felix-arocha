<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aula Virtual LPR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css?v=11">
</head>
<body>
  <header class="topbar">
    <div class="inner">
      <a class="logo" href="#/clases"><span class="mark">LPR</span><span>Aula Virtual</span></a>
      <nav class="nav" id="nav"></nav>
      <div class="usuario">
        <div class="campana">
          <button class="btn ghost" id="btnCampana" aria-label="Notificaciones">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span class="contador hidden" id="contador">0</span>
          </button>
          <div class="panel-notif hidden" id="panelNotif"></div>
        </div>
        <a class="perfil-link" href="#/perfil" title="Mi perfil">
          <span class="avatar" id="avatarTopbar"></span>
          <div class="info">
            <div class="nombre" id="nombreUsuario"></div>
            <div class="rol" id="rolUsuario"></div>
          </div>
        </a>
        <button class="btn small" onclick="API.salir()">Salir</button>
      </div>
    </div>
  </header>

  <main id="vista"></main>

  <script src="/js/api.js?v=11"></script>
  <script src="/js/visor.js?v=11"></script>
  <script src="/js/secciones.js?v=11"></script>
  <script src="/js/admin.js?v=11"></script>
  <script src="/js/solicitudes.js?v=11"></script>
  <script src="/js/perfil.js?v=11"></script>
  <script src="/js/app.js?v=11"></script>
</body>
</html>

# API Gateway: punto de entrada unico (http://localhost)
# El navegador solo conoce el puerto 80; Nginx reparte cada /api/* a su microservicio.
events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  client_max_body_size 50m;           # presentaciones grandes

  # Resolver de Docker: los nombres de servicio se resuelven en la red interna
  upstream auth_svc   { server servicio-auth:8000; }
  upstream ia_svc     { server servicio-ia:3000; }
  upstream clases_svc { server servicio-clases:8080; }
  upstream notif_svc  { server servicio-notificaciones:8080; }

  server {
    listen 80;

    # ---- Frontend estatico
    location / {
      root  /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }

    # ---- Microservicios
    location /api/auth/ {
      proxy_pass http://auth_svc/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/clases/ {
      proxy_pass http://clases_svc/;
      proxy_set_header Host $host;
      proxy_read_timeout 300s;          # la IA puede tardar
    }
    location /api/ia/ {
      proxy_pass http://ia_svc/;
      proxy_set_header Host $host;
      proxy_read_timeout 300s;
    }
    location /api/notificaciones/ {
      proxy_pass http://notif_svc/;
      proxy_set_header Host $host;
    }
  }
}

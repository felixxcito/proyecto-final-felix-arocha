# API Gateway: punto de entrada unico (https://localhost)
# El navegador solo conoce este punto de entrada (HTTPS en el 443; el 80 redirige);
# Nginx reparte cada /api/* a su microservicio por la red interna.
events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  client_max_body_size 50m;           # presentaciones grandes

  # Resolver de Docker: los nombres de servicio se resuelven en la red interna
  upstream auth_svc   { server servicio-auth:8000; }
  upstream ia_svc     { server servicio-ia:3000; }
  upstream clases_svc { server servicio-clases:8080; }
  upstream notif_svc  { server servicio-notificaciones:8080; }

  # Limite de intentos por IP: 10 por minuto (con un margen de 5 seguidos). Frena adivinar claves o
  # codigos y evita usar el registro para llenar de correos a alguien.
  limit_req_zone $binary_remote_addr zone=acceso:10m rate=10r/m;
  limit_req_status 429;

  # HTTP -> HTTPS: todo lo que llegue al puerto 80 se redirige al 443
  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ---- Frontend estatico
    location / {
      root  /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";   # siempre la ultima version del frontend
    }

    # ---- Verificacion de sesion: ANTES de reenviar cada peticion a un servicio, Nginx le pregunta a Python
    # si la cuenta del token sigue activa. Si el admin desactivo o elimino al usuario, responde 401 al
    # instante en los 4 servicios (sin esto, el token seguiria funcionando hasta que venza).
    location = /_verificar {
      internal;                                     # solo Nginx puede llamarlo, nadie desde afuera
      proxy_pass http://auth_svc/verificar;
      proxy_pass_request_body off;                  # solo importan los headers y la URL
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri; # para leer el ?token= del visor de PDF
    }
    error_page 401 = @sesion_invalida;
    location @sesion_invalida {
      default_type application/json;
      return 401 '{"detail":"Tu sesion ya no es valida. Inicia sesion de nuevo."}';
    }

    error_page 429 = @demasiados_intentos;
    location @demasiados_intentos {
      default_type application/json;
      return 429 '{"detail":"Demasiados intentos. Espera un minuto e intenta de nuevo."}';
    }

    # ---- Rutas de acceso: con limite de intentos y SIN verificar sesion (todavia no hay una)
    location = /api/auth/login {
      limit_req zone=acceso burst=5 nodelay;
      auth_request off;
      proxy_pass http://auth_svc/login;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /api/auth/registro {
      limit_req zone=acceso burst=5 nodelay;
      auth_request off;
      proxy_pass http://auth_svc/registro;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /api/auth/recuperar {
      limit_req zone=acceso burst=5 nodelay;
      auth_request off;
      proxy_pass http://auth_svc/recuperar;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Microservicios
    location /api/auth/ {
      auth_request /_verificar;
      proxy_pass http://auth_svc/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/clases/ {
      auth_request /_verificar;
      proxy_pass http://clases_svc/;
      proxy_set_header Host $host;
      proxy_read_timeout 300s;          # la IA puede tardar
    }
    location /api/ia/ {
      auth_request /_verificar;
      proxy_pass http://ia_svc/;
      proxy_set_header Host $host;
      proxy_read_timeout 300s;
    }
    location /api/notificaciones/ {
      auth_request /_verificar;
      proxy_pass http://notif_svc/;
      proxy_set_header Host $host;
    }
  }
}
